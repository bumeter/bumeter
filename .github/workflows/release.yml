# Build installers for Linux, macOS, Windows.
# - Run manually (workflow_dispatch) or push to main: the installers appear under the run's Artifacts.
# - Push a v* tag (e.g. v1.2.0): creates a published GitHub Release with the installers attached,
#   plus the `latest.json` + `.sig` files the in-app updater reads (Settings → Updates).
#
# The bundles are built by tauri-action so it can generate `latest.json` for us (updater on,
# NSIS preferred on Windows). `tauri.ci.conf.json` turns on `createUpdaterArtifacts` for CI only:
# local `tauri build` keeps working without the signing key.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04 # glibc 2.35: runs from Ubuntu 22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `bum` ships with the app (externalBin "binaries/bum" → bum-<target>[.exe]), from bumeter/statusline.
      - name: Fetch bum (sidecar)
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          scripts/fetch-bum.sh ${{ matrix.target }} "app/src-tauri/binaries/bum-${{ matrix.target }}$ext"

      # @bumeter/ui (the built screens, frontendDist) and the Tauri CLI.
      - name: Install UI and Tauri CLI
        working-directory: app
        run: npm ci

      # Builds every bundle, and on a v* tag also creates the Release and uploads `latest.json`.
      # `tagName`/`releaseName` are left empty on main so nothing is released from a branch push.
      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Bumeter {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      # The NSIS hooks (`app/src-tauri/windows/hooks.nsh`) edit the user's PATH; this runs the real
      # installer silently and checks both directions, since nothing else on CI executes them.
      - name: Windows installer puts bum on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $userPath = { (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames') -split ';' | Where-Object { $_ } }
          $setup = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = & $userPath | Where-Object { Test-Path (Join-Path $_ 'bum.exe') } | Select-Object -First 1
          if (-not $dir) { throw "bum.exe is not on the user PATH after install: $(& $userPath -join ';')" }
          & (Join-Path $dir 'bum.exe') --help
          if ($LASTEXITCODE -ne 0) { throw "bum --help failed" }
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          # The uninstaller copies itself to a temp file and returns at once; give it time to finish.
          for ($i = 0; $i -lt 30 -and ((& $userPath) -contains $dir); $i++) { Start-Sleep -Seconds 1 }
          if ((& $userPath) -contains $dir) { throw "uninstall left $dir on the user PATH" }
          Write-Host "PATH entry added on install and removed on uninstall: $dir"

      - name: Collect installers
        run: |
          mkdir -p dist
          b="target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          for f in "$b"/deb/*.deb "$b"/appimage/*.AppImage "$b"/dmg/*.dmg "$b"/nsis/*.exe "$b"/msi/*.msi; do
            cp "$f" dist/
          done
          ls -la dist
          [ -n "$(ls dist)" ] || { echo "No installers found"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bumeter-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
