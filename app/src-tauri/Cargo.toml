[package]
name = "bumeter"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
bum-core = { git = "https://github.com/bumeter/core", tag = "v1.2.0" }
bum-service = { git = "https://github.com/bumeter/core", tag = "v1.2.0" }
bum-adapters = { git = "https://github.com/bumeter/core", tag = "v1.2.0" }
bum-skills = { git = "https://github.com/bumeter/core", tag = "v1.2.0" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile.workspace = true
